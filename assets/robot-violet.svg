<svg viewBox="0 0 300 320" xmlns="http://www.w3.org/2000/svg" width="300" height="320" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <g transform="">
  <circle cx="150" cy="160" r="140" fill="url(#glow)">
    <animate attributeName="r" values="125;145;125" dur="4s" repeatCount="indefinite"/>
  </circle>
  <!-- stars -->
  <g fill="#fff">
    <circle cx="30" cy="40" r="2"><animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="265" cy="70" r="2"><animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="50" cy="250" r="1.5"><animate attributeName="opacity" values="0;1;0" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="255" cy="240" r="2"><animate attributeName="opacity" values="0;1;0" dur="1.8s" repeatCount="indefinite"/></circle>
  </g>
  <!-- shadow -->
  <ellipse cx="150" cy="300" rx="55" ry="8" fill="#000" opacity="0.35">
    <animate attributeName="rx" values="55;42;55" dur="3s" repeatCount="indefinite"/>
  </ellipse>
  <!-- floating robot -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-14;0,0" dur="3s" repeatCount="indefinite"/>
    <!-- antenna -->
    <line x1="150" y1="50" x2="150" y2="25" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    <circle cx="150" cy="20" r="8" fill="#a78bfa">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="r" values="8;11;8" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <!-- head -->
    <rect x="95" y="50" width="110" height="85" rx="26" fill="url(#body)" stroke="#a78bfa" stroke-width="3"/>
    <rect x="108" y="66" width="84" height="52" rx="18" fill="#020617"/>
    <!-- eyes -->
    <ellipse cx="132" cy="92" rx="10" ry="12" fill="#a78bfa">
      <animate attributeName="ry" values="12;12;1;12;12" keyTimes="0;0.45;0.5;0.55;1" dur="4s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="168" cy="92" rx="10" ry="12" fill="#a78bfa">
      <animate attributeName="ry" values="12;12;1;12;12" keyTimes="0;0.45;0.5;0.55;1" dur="4s" repeatCount="indefinite"/>
    </ellipse>
    <path d="M138 108 Q150 117 162 108" stroke="#a78bfa" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- ears -->
    <rect x="84" y="80" width="12" height="28" rx="5" fill="#a78bfa"/>
    <rect x="204" y="80" width="12" height="28" rx="5" fill="#a78bfa"/>
    <!-- neck -->
    <rect x="138" y="135" width="24" height="12" fill="#475569"/>
    <!-- torso -->
    <rect x="102" y="147" width="96" height="88" rx="22" fill="url(#body)" stroke="#a78bfa" stroke-width="3"/>
    <!-- chest panel -->
    <rect x="124" y="165" width="52" height="34" rx="8" fill="#020617"/>
    <rect x="130" y="188" width="6" height="6" fill="#a78bfa"><animate attributeName="height" values="6;20;6" dur="1s" repeatCount="indefinite"/><animate attributeName="y" values="188;174;188" dur="1s" repeatCount="indefinite"/></rect>
    <rect x="142" y="188" width="6" height="6" fill="#a78bfa"><animate attributeName="height" values="14;6;14" dur="1.3s" repeatCount="indefinite"/><animate attributeName="y" values="180;188;180" dur="1.3s" repeatCount="indefinite"/></rect>
    <rect x="154" y="188" width="6" height="6" fill="#a78bfa"><animate attributeName="height" values="6;22;6" dur="0.8s" repeatCount="indefinite"/><animate attributeName="y" values="188;172;188" dur="0.8s" repeatCount="indefinite"/></rect>
    <rect x="166" y="188" width="6" height="6" fill="#a78bfa"><animate attributeName="height" values="10;4;10" dur="1.1s" repeatCount="indefinite"/><animate attributeName="y" values="184;190;184" dur="1.1s" repeatCount="indefinite"/></rect>
    <circle cx="150" cy="215" r="6" fill="#a78bfa"><animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/></circle>
    <!-- left arm -->
    <rect x="72" y="158" width="22" height="62" rx="11" fill="url(#body)" stroke="#a78bfa" stroke-width="2"/>
    <circle cx="83" cy="226" r="10" fill="#94a3b8"/>
    <!-- waving arm -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 206 165;-35 206 165;10 206 165;-35 206 165;0 206 165" dur="2.4s" repeatCount="indefinite"/>
      <rect x="206" y="158" width="22" height="62" rx="11" fill="url(#body)" stroke="#a78bfa" stroke-width="2"/>
      <circle cx="217" cy="226" r="10" fill="#94a3b8"/>
    </g>
    <!-- legs -->
    <rect x="116" y="235" width="26" height="36" rx="8" fill="#334155"/>
    <rect x="158" y="235" width="26" height="36" rx="8" fill="#334155"/>
    <rect x="108" y="268" width="40" height="14" rx="7" fill="#a78bfa"/>
    <rect x="152" y="268" width="40" height="14" rx="7" fill="#a78bfa"/>
  </g>
  </g>
</svg>